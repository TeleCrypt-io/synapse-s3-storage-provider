name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  # In order to check out the repository.
  contents: read

jobs:
  lint:
    name: "Lint & Packaging"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          # Keep the lint/packaging gate on the oldest supported runtime; the
          # test matrix below covers newer interpreters separately.
          python-version: "3.10"

      - name: "Install dependencies"
        run: |
          set -xe
          python -VV
          python -m site
          python -m pip install 'tox==4.61.2'
      - name: "Run tox lint targets"
        run: "python -m tox -e check_isort,pep8,packaging"

  build:
    # This is similar to the job in `release.yml`, but it does NOT upload to PyPI.
    # We include it here to reduce the likelihood of someone publishing a release
    # which doesn't build.
    name: "Build and check Python package"
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: "Install packaging tools"
        run: "python -m pip install 'build==1.6.0' 'twine==7.0.0'"

      - name: "Build dist package"
        run: "python -m build"

      - name: "Run twine checks"
        run: "python -m twine check dist/*"


  tests:
    needs: lint
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install dependencies"
        run: |
          set -xe
          python -VV
          python -m site
          python -m pip install 'tox==4.61.2'
      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox -e py"
