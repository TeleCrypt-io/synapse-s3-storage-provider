[base]
deps =
    coverage
    boto3
    # Match the exact Synapse source release consumed by the TeleCrypt v1 image.
    matrix-synapse==1.159.0

setenv =
    PYTHONDONTWRITEBYTECODE = no_byte_code

[testenv]
deps =
    {[base]deps}

setenv =
    {[base]setenv}

passenv = *

commands =
    coverage run --include=s3_storage_provider.py -m twisted.trial test_s3
    coverage report -m

[testenv:packaging]
deps =
    check-manifest
commands =
    check-manifest

[testenv:pep8]
skip_install = True
basepython = python3
deps =
    flake8
    # We pin so that our tests don't start failing on new releases of black.
    black==19.10b0
commands =
    python -m black --check --diff . s3_storage_provider.py setup.py test_s3.py
    flake8 s3_storage_provider.py setup.py test_s3.py

[testenv:check_isort]
skip_install = True
deps = isort
commands = isort -c -sp setup.cfg -rc s3_storage_provider.py setup.py test_s3.py
